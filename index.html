*{box-sizing:border-box;margin:0}
:root{--bg:#120F0D;--s1:#221C18;--s2:#2B2420;--tx:#F5EEE6;--mu:#B9AD9F;--fa:#9C9083;--am:#FFBE1A;--or:#F06418;--rd:#C81E1E;--gr:linear-gradient(135deg,#FFC93A 0%,#F7902A 55%,#F06418 100%)}
body{width:390px;min-height:844px;color:var(--tx);font:400 15px/1.4 -apple-system,"SF Pro Text","Inter","Segoe UI",system-ui,sans-serif;background:radial-gradient(120% 60% at 50% -10%,#3A2216 0%,rgba(18,15,13,0) 60%),linear-gradient(180deg,#17120F,#100D0B);-webkit-font-smoothing:antialiased;padding-bottom:24px}
.num{font-variant-numeric:tabular-nums}
.disp{font-family:"RP Montserrat",sans-serif;font-weight:600;letter-spacing:-.02em}
.sb{height:47px;display:flex;align-items:flex-end;justify-content:space-between;padding:0 30px 6px 34px;font-weight:600;font-size:16px}
.sb i{font-style:normal;font-size:13px;letter-spacing:.05em}
.ab{display:flex;align-items:center;gap:10px;padding:8px 20px}
.ab svg{filter:drop-shadow(0 2px 8px rgba(240,100,24,.45))}
.wm{font-family:"RP Montserrat";font-weight:600;font-size:12px;letter-spacing:.3em}
.ab .av{margin-left:auto;width:32px;height:32px;border-radius:50%;background:var(--s2);display:grid;place-items:center;font-size:12px;font-weight:600;color:var(--mu);box-shadow:inset 0 1px 0 rgba(255,255,255,.08)}
.hd{padding:12px 20px 16px}
.chips{display:flex;align-items:center;gap:8px}
.pill{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;border-radius:13px;font-size:11px;font-weight:600;letter-spacing:.08em}
.pill.ci{background:rgba(110,200,130,.14);color:#9FE0AE;box-shadow:inset 0 0 0 1px rgba(140,220,160,.25)}
.pill.ci:before{content:"";width:6px;height:6px;border-radius:50%;background:#7BD893;box-shadow:0 0 8px #7BD893}
.pill.ou{background:rgba(255,190,26,.12);color:#FFCF5A;box-shadow:inset 0 0 0 1px rgba(255,190,26,.28)}
.prov{margin-left:auto;font-size:13px;color:var(--mu)}
.name{font-size:30px;line-height:1.1;margin:14px 0 6px}
.meta{display:flex;justify-content:space-between;align-items:center;color:var(--mu);font-size:14px;min-height:32px}
.lnk{color:#FFC84A;font-weight:600;font-size:14px;min-height:44px;display:inline-flex;align-items:center;gap:6px}
.notes{display:flex;justify-content:space-between;align-items:center;margin-top:8px;padding:0 4px 0 14px;min-height:44px;border-radius:12px;background:rgba(255,255,255,.04);font-size:13px;color:var(--mu)}
.lab{font-family:"RP Montserrat";font-weight:600;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--mu)}
.wrap{padding:0 16px}
.card{position:relative;border-radius:20px;padding:16px;margin-bottom:12px;background:linear-gradient(180deg,#2A231F,#221C18);box-shadow:inset 0 1px 0 rgba(255,255,255,.07),0 1px 0 rgba(0,0,0,.4),0 10px 24px -8px rgba(0,0,0,.6)}
.bd{display:inline-grid;place-items:center;width:44px;height:44px;border-radius:0;font-family:"RP Montserrat";font-weight:600;font-size:17px;letter-spacing:.02em;color:#1A120C;background:#FFBE1A;box-shadow:none}
.big{color:#FFBE1A;line-height:1}
.chev{color:var(--fa);font-size:22px;line-height:1}
.tile{display:grid;grid-template-columns:44px 1fr auto;gap:4px 14px;align-items:center}
.tile .dx{font-size:20px}.tile .drug{font-size:16px;color:var(--tx)}
.tile .iv{font-size:32px;text-align:right}
.foot{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center;margin-top:12px;padding-top:12px;border-top:1px solid rgba(255,255,255,.07);font-size:13px;color:var(--mu)}
.oct{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:#FFC84A}
.oct:before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.oct.q{color:var(--mu)}
.pressed{transform:scale(.985);background:linear-gradient(180deg,#322A25,#29221E)}
.btns{display:flex;gap:12px;margin-top:4px}
.b{flex:1;height:52px;border-radius:16px;display:grid;place-items:center;font-weight:600;font-size:16px}
.b.p{background:var(--gr);color:#1A120C;box-shadow:0 8px 20px -8px rgba(240,100,24,.7),inset 0 1px 0 rgba(255,255,255,.35)}
.b.s{background:var(--s2);color:var(--tx);box-shadow:inset 0 1px 0 rgba(255,255,255,.07)}
.tabs{display:flex;align-items:center;margin:0 16px 12px;padding:4px;border-radius:14px;background:rgba(255,255,255,.05)}
.back{min-width:72px;height:44px;display:flex;align-items:center;gap:4px;color:#FFC84A;font-weight:600;font-size:15px;padding-left:8px}
.tab{flex:1;height:40px;display:grid;place-items:center;border-radius:10px;font-weight:600;color:var(--mu);font-size:15px;position:relative}
.tab.on{background:var(--s2);color:var(--tx);box-shadow:0 2px 8px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.08)}
.tab.on:after{content:"";position:absolute;bottom:5px;width:18px;height:3px;border-radius:2px;background:var(--gr)}
.hero{padding:20px;background:radial-gradient(90% 120% at 100% 0%,rgba(240,100,24,.22),rgba(0,0,0,0) 60%),linear-gradient(180deg,#2E2520,#221C18)}
.hero .r{display:flex;align-items:center;gap:14px}
.hero .bd{width:56px;height:56px;font-size:22px}
.hero .eye{font-size:13px;color:var(--mu);letter-spacing:.02em}.hero .dx{font-size:24px}
.hero .ivb{margin-left:auto;text-align:right}.hero .iv{font-size:42px}
.cap{font-size:11px;color:var(--mu);letter-spacing:.06em;margin-top:4px}
.hero .ft{margin-top:16px;padding-top:12px;border-top:1px solid rgba(255,255,255,.08);display:flex;justify-content:space-between;font-size:13px;color:var(--mu)}
.lv{padding:14px 16px;background:linear-gradient(180deg,#26201C,#1F1A16)}
.lv .row{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.tag{height:28px;padding:0 10px;border-radius:8px;background:rgba(255,255,255,.06);display:inline-flex;align-items:center;font-size:13px;color:var(--tx)}
.tag.ok{color:#9FE0AE;background:rgba(110,200,130,.12)}
.hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.stats{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
.st{min-width:0;overflow:hidden;border-radius:14px;padding:12px;background:rgba(0,0,0,.22);box-shadow:inset 0 0 0 1px rgba(255,255,255,.05)}
.st .k{font-size:12px;color:var(--mu)}.st .v{font-size:26px;margin-top:2px}.st .u{font-size:13px;color:var(--mu);margin-left:3px;font-family:inherit}
.seg{display:flex;padding:4px;border-radius:14px;background:rgba(0,0,0,.28);box-shadow:inset 0 1px 2px rgba(0,0,0,.4)}
.seg span{flex:1;height:44px;display:grid;place-items:center;border-radius:11px;font-size:14px;font-weight:600;color:var(--mu)}
.seg span.on{background:var(--gr);color:#1A120C;box-shadow:0 4px 12px -4px rgba(240,100,24,.7),inset 0 1px 0 rgba(255,255,255,.35)}
.cst{display:flex;align-items:baseline;gap:8px;margin-bottom:12px}.cst .v{font-size:32px}.cst .d{font-size:13px;color:#9FE0AE}

/* Desktop splash (items 68 + 71 + 76 + 78), ported faithfully */
.rp-splash{position:fixed;inset:0;z-index:10000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:var(--bg,#000000);color:var(--text,#F5EEE6);cursor:pointer;--sp-glow:#FF9A1F;--font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,"Noto Sans",sans-serif;transition:opacity .34s ease;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);box-sizing:border-box}

case'setback':S.view=S.setFrom&&S.setFrom!=='set'&&P()?S.setFrom:'list';render();break;

case'close':closeSheet();break;

case'oct':openSheet('<h3>OCT today · '+k+'</h3>'+OCTS.map(function(x){return '<button class="opt'+(e.oct===x?' on':'')+'" data-a="setoct" data-k="'+k+'" data-v="'+x+'">'+x+'</button>'}).join(''));break;
case'setoct':e.oct=el.dataset.v;closeSheet();rePane(k);break;
case'vi':openSheet('<h3>'+k+' · Vision and IOP history</h3><div class="hl">Visual acuity (letters, approximate)</div>'+chart(e.vah.map(function(x){return Math.round((x-30)/2)}),'va'+k,326,function(v){return v*2+30})+'<div class="hl" style="margin-top:12px">IOP (mmHg)</div>'+chart(e.ioph.map(function(x){return x-6}),'io'+k,326,function(v){return v+6})+'<button class="b s" style="display:grid;margin-top:16px" data-a="close">Close</button>');break;

case'det':var dl=e.det||[];e.det=dl.indexOf(el.dataset.v)>=0?dl.filter(function(x){return x!==el.dataset.v}):dl.concat([el.dataset.v]);rePane(k);break;
case'ocxc':e.ctx=ocxToggle(e.ctx,el.dataset.v);rePane(k);var inp=document.querySelector('#p'+k+' .ocx-t');if(inp){inp.focus();inp.setSelectionRange(inp.value.length,inp.value.length)}break;

case'reset':if(confirm('Reset all demo data?')){S={pts:demo(),view:'list',pid:null,eye:'OD',set:S.set};render()}break;}}
